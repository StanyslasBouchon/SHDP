[package]
name = "shdp"
version = "1.2.0"
authors = ["Devling"]
edition = "2021"
license = "MIT"
description = "A new protocol (SHDP)"
repository = "https://github.com/StanyslasBouchon/SHDP/tree/master"
readme = "README.md"

[dependencies]
async-tls = { version = "0.13.0", optional = true }
async-tungstenite = { version = "0.32.0", optional = true }
bitvec = "1.0.1"
ctor = "0.6.1"
ego-tree = { version = "0.10.0", optional = true }
futures = { version = "0.3.30", optional = true }
html-minifier = { version = "5.0.0", optional = true }
lazy_static = "1.5.0"
openssl = { version = "0.10.75", optional = true }
rustls = { version = "0.21.12", default-features = false, features = [
    "log",
    "logging",
    "tls12",
], optional = true }
rustls-pemfile = { version = "1.0.4", optional = true }
scraper = { version = "0.24.0", optional = true }
serde = { version = "1.0.228", optional = true }
serde_json = { version = "1.0.145", optional = true }
smol = { version = "2.0.2", optional = true }
tokio = { version = "1.48.0", features = [
    "full",
    "sync",
    "test-util",
], optional = true }
tokio-openssl = { version = "0.6.5", optional = true }
tungstenite = { version = "0.28.0", optional = true }


[features]
default = ["ws-server", "serde", "debug"]
serde = ["dep:serde", "dep:serde_json"]
tcp-server = ["html-minifier", "ego-tree", "scraper", "dep:tokio", "dep:smol"]
tcp-client = ["dep:tokio"]
ws-server = [
    "html-minifier",
    "ego-tree",
    "scraper",
    "futures",
    "dep:tokio",
    "tungstenite",
    "dep:async-tungstenite",
    "dep:smol",
]
ws-client = ["tungstenite", "dep:tokio"]
wss-server = ["ws-server", "async-tls", "rustls", "rustls-pemfile"]
wss-client = ["ws-client", "openssl"]
tls-client = ["tcp-client", "openssl", "dep:tokio-openssl"]
tls-server = ["tcp-server", "openssl", "dep:tokio-openssl"]
debug = []
